[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "bioforge"
version = "0.1.0"
requires-python = ">=3.12"
authors = [{ name = "Guillaume Collet" }]

# Dépendances de développement (charte v4.2)
[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-benchmark>=4.0,<5.0",
    "pytest-regressions>=2.0,<3.0",
    "hypothesis>=6.0,<7.0",
    "ruff>=0.4,<0.5",
    "pyright>=1.1,<2.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]

# Configuration pour ruff (linting)
[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "I", "B", "C4", "UP"]
target-version = "py312"

# Configuration pour pyright (typage strict)
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
