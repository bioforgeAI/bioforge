name: CI

on: [push, pull_request]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Charte §5 : utilisation du lockfile uv pour la reproductibilité
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies (lockfile)
        run: uv sync --frozen --all-extras

      - name: Check for forbidden 'reference' imports in production code
        run: |
          if grep -rn "from reference" bioforge/ src/ --include="*.py" --include="*.rs" 2>/dev/null; then
            echo "::error::Forbidden import from 'reference' detected in production code!"
            exit 1
          fi
          if grep -rn "import reference" bioforge/ src/ --include="*.py" --include="*.rs" 2>/dev/null; then
            echo "::error::Forbidden import from 'reference' detected in production code!"
            exit 1
          fi
          echo "✅ No forbidden reference imports found."

      - name: Check for NotImplementedError in production code
        run: |
          if grep -rn "NotImplementedError" bioforge/ src/ --include="*.py" --include="*.rs" 2>/dev/null | grep -v "test" | grep -v "reference/"; then
            echo "::error::NotImplementedError found in production code!"
            exit 1
          fi
          echo "✅ No forbidden NotImplementedError found."

      - name: Lint & Type Check
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pyright

      - name: Test Python (Unit & Differential)
        run: uv run pytest tests/ -v

      - name: Rust fmt
        run: cargo fmt --check

      # Charte §3 : clippy avec lints pedantic
      - name: Rust clippy (pedantic)
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic

      - name: Rust unit tests
        run: cargo test

  # Charte §7 : ASan + LSan obligatoires dans la CI standard.
  # Valgrind a été remplacé car il génère trop de faux positifs avec PyO3.
  sanitizers:
    runs-on: ubuntu-latest
    name: Memory Safety (ASan + LSan)
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain + rust-src
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly
          rustup target add x86_64-unknown-linux-gnu --toolchain nightly

      - name: Run Rust tests under AddressSanitizer + LeakSanitizer
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -- --test-threads=1
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1"

  # Charte §7 : Miri optionnel, uniquement si du code `unsafe` est présent.
  # Décommente ce job si tu réintroduis du code unsafe (ex: from_utf8_unchecked).
  #
  # miri:
  #   runs-on: ubuntu-latest
  #   name: Undefined Behavior (Miri)
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Install Miri
  #       run: |
  #         rustup toolchain install nightly
  #         rustup component add miri --toolchain nightly
  #     - name: Run Miri on pure Rust tests
  #       run: cargo +nightly miri test
  #       env:
  #         MIRIFLAGS: "-Zmiri-disable-isolation"
  benchmarks:
    runs-on: ubuntu-latest
    name: Benchmarks (non-blocking)
    continue-on-error: true # Non bloquant pour l'instant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install BioForge + Biopython
        run: |
          uv sync --frozen --all-extras
          uv pip install -r benchmarks/requirements.txt
      - name: Build Rust extension
        run: uv run maturin develop
      - name: Run benchmarks
        run: uv run pytest benchmarks/ -v --benchmark-disable-gc
